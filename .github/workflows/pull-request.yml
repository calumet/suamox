name: ci

on: pull_request

# Un push nuevo al PR cancela la verificacion anterior, que ya no interesa
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # GitHub Packages pide token hasta para leer un paquete publico, y las deps
    # `@calumet` salen de ahi. Sin esto el install solo funciona mientras la
    # version pedida siga en el cache del store
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@calumet"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build va antes que typecheck: los paquetes se referencian entre si por
      # `workspace:` y sus tipos salen de dist/, que no existe hasta compilar
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec oxfmt --check
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@calumet"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # test-results/ lleva las trazas y capturas de los tests que fallaron
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
